# /etc/nginx/sites-available/justkidora.conf  (then: ln -s ... sites-enabled/)
# HTTPS certificates: sudo certbot --nginx -d justkidora.com -d www.justkidora.com -d api.justkidora.com
# Certbot adds the listen 443 / ssl_certificate lines and the http->https redirect.

# Web app
server {
  listen 80;
  server_name justkidora.com www.justkidora.com;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API
server {
  listen 80;
  server_name api.justkidora.com;
  client_max_body_size 512M;   # lesson video uploads (UPLOAD_MAX_BYTES)

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The OAuth state cookie is marked Secure when this says https.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Live games and chat (Socket.IO websockets)
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
